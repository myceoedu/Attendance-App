<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Allow zoom for accessibility (PageSpeed / low-vision users). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="myRekod: workforce attendance, leave and claims.">
  <meta name="theme-color" content="#1A56DB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="myRekod">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>myRekod</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Immediate first paint: branded splash so users (and Lighthouse) see content
    before main.dart.js / CanvasKit finish loading.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0F2255;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    /* Flutter's hidden editor must be ≥16px or iOS PWA will not show the keyboard. */
    input, textarea {
      font-size: 16px !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(160deg, #0F2255 0%, #1A3A8F 48%, #1A56DB 100%);
      color: #fff;
      transition: opacity 280ms ease, visibility 280ms ease;
    }
    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.4px;
    }
    #splash .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin: 0;
    }
    #splash .sub {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.72;
    }
    #splash .spinner {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      border: 3px solid rgba(255, 255, 255, 0.22);
      border-top-color: #2DD4BF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash" aria-busy="true" aria-live="polite">
    <div class="mark" aria-hidden="true">mR</div>
    <p class="title">myRekod</p>
    <p class="sub">Workforce management</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    // Always load the latest Vercel deploy on this same URL / home-screen icon.
    // 1) Drop any leftover Flutter service worker.
    // 2) If deploy-id.txt changed since last open, clear Cache Storage and reload once.
    (function () {
      var STORAGE_KEY = 'myrekod-deploy-id';
      var reloading = false;

      function clearSiteCaches() {
        var tasks = [];
        if (navigator.serviceWorker) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }),
          );
        }
        if (window.caches) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }),
          );
        }
        return Promise.all(tasks);
      }

      function reloadOnce() {
        if (reloading) return;
        reloading = true;
        clearSiteCaches().finally(function () {
          location.reload();
        });
      }

      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }

      fetch('deploy-id.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : ''; })
        .then(function (raw) {
          var id = String(raw || '').trim();
          if (!id) return;
          var prev = null;
          try { prev = localStorage.getItem(STORAGE_KEY); } catch (e) {}
          try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
          if (prev && prev !== id) reloadOnce();
        })
        .catch(function () {});
    })();

    // Hide splash once Flutter paints the first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 320);
    });

    // iOS Add-to-Home-Screen (standalone) blocks the keyboard unless a real
    // <input> is focused in the same tap. Flutter draws fields on a canvas and
    // focuses its editor a frame later — Safari tabs allow that; the home-screen
    // app does not. Unlock on touchstart, then hand off to Flutter's input.
    (function () {
      var ua = navigator.userAgent || '';
      var iOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!iOS) return;
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;

      var dummy = document.createElement('input');
      dummy.id = 'ios-pwa-keyboard';
      dummy.type = 'text';
      dummy.inputMode = 'text';
      dummy.autocomplete = 'off';
      dummy.setAttribute('autocapitalize', 'off');
      dummy.setAttribute('autocorrect', 'off');
      dummy.setAttribute('spellcheck', 'false');
      dummy.setAttribute('aria-hidden', 'true');
      dummy.tabIndex = -1;
      dummy.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;font-size:16px;border:0;padding:0;margin:0;z-index:0;pointer-events:none;';
      document.body.appendChild(dummy);

      function isEditor(el) {
        if (!el || el === dummy) return false;
        var tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || !!el.isContentEditable;
      }

      function flutterEditor() {
        var nodes = document.querySelectorAll('input, textarea');
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i] !== dummy) return nodes[i];
        }
        return null;
      }

      var handoffTimer = 0;
      function cancelHandoff() {
        if (handoffTimer) {
          clearTimeout(handoffTimer);
          handoffTimer = 0;
        }
      }

      function handoffToFlutter() {
        var editor = flutterEditor();
        if (editor) {
          editor.style.fontSize = '16px';
          editor.focus();
          cancelHandoff();
          return true;
        }
        return false;
      }

      document.addEventListener('touchstart', function (e) {
        if (isEditor(e.target)) return;
        dummy.focus({ preventScroll: true });
      }, { capture: true, passive: true });

      document.addEventListener('touchend', function () {
        if (handoffToFlutter()) return;
        cancelHandoff();
        var tries = 0;
        function tick() {
          tries += 1;
          if (handoffToFlutter()) return;
          if (tries < 12) {
            handoffTimer = setTimeout(tick, 16);
            return;
          }
          if (document.activeElement === dummy) dummy.blur();
        }
        handoffTimer = setTimeout(tick, 16);
      }, { capture: true, passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
